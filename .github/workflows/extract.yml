name: Extract menu files
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip to root
        run: |
          if [ ! -f menu-bolphis-github.zip ]; then echo "No zip file, nothing to do"; exit 0; fi
          unzip -o menu-bolphis-github.zip
          if [ -d menu-github ]; then cp -r menu-github/. .; rm -rf menu-github; fi
          rm -f menu-bolphis-github.zip
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract menu files to root" || exit 0
          git push
